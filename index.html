<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rubrica DOM</title>

    <!-- FONTAWESOME CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- CSS BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

    <!-- FAVICON -->
     <link rel="shortcut icon" href="./phone-book.jpg" type="image/x-icon">

    <!-- CSS CUSTOM -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <h1 class="text-center my-5 display-1">La mia rubrica</h1>

    <!-- section dedicata al cellphone -->
    <section class="container cellphone">
        <div class="row align-items-center">

            <div class="col-6">
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon1"><i class="fa-regular fa-user"></i></span>
                    <input id="nameInput" type="text" class="form-control" placeholder="Nome Contatto" aria-label="Username"
                        aria-describedby="basic-addon1" value="">
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon1"><i class="fa-solid fa-mobile-screen-button"></i></span>
                    <input id="numberInput" type="number" class="form-control" placeholder="Numero Contatto" aria-label="Username"
                        aria-describedby="basic-addon1">
                </div>
            </div>

            <div class="col-6 d-flex flex-column">
                <button id="addContactsBtn" class="btnC">Aggiungi</button>
                <button id="removeContactsBtn" class="btnC">Rimuovi</button>
            </div>

            <div class="col-12 d-flex justify-content-center">
                <button id="showContactsBtn" class="btnC">Mostra Rubrica</button>
            </div>

        </div>
    </section>

    <!-- section dedicata ai contatti -->
    <section class="container my-5">
        <div id="cardsWrapper" class="row justify-content-center">
            <!-- qui andranno le card dei contatti -->
        </div>
    </section>

    <!-- JS BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>

    <!-- JS CUSTOM -->
    <script src="./script.js"></script>
</body>

</html>
